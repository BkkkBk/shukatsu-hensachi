      color: #1a1a2e;

    }
    .subtitle {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 28px;
    }
    .search-box {
      width: 100%;
      max-width: 520px;
      position: relative;
      margin-bottom: 24px;
    }
    .search-box input {
      width: 100%;
      padding: 14px 48px 14px 18px;
      font-size: 1.05rem;
      border: 2px solid #dde3f0;
      border-radius: 12px;
      outline: none;
      background: #fff;
      transition: border-color .2s;
      color: #222;
    }
    .search-box input:focus { border-color: #4a6fa5; }
    .search-box .clear-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      color: #aaa;
      display: none;
      line-height: 1;
    }
    .search-box input:not(:placeholder-shown) ~ .clear-btn { display: block; }

    .tabs {
      width: 100%;
      max-width: 520px;
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 0.92rem;
      font-weight: 600;
      border: 2px solid #dde3f0;
      border-radius: 10px;
      background: #fff;
      color: #889;
      cursor: pointer;
      transition: all .15s;
      user-select: none;
    }
    .tab:hover { border-color: #b9c6e0; }
    .tab.active {
      background: #4a6fa5;
      border-color: #4a6fa5;
      color: #fff;
    }

    .results {
      width: 100%;
      max-width: 520px;
    }
    .result-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      animation: fadeIn .15s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px) } to { opacity:1; transform:none } }
    .company-name {
      font-size: 1rem;
      color: #1a1a2e;
      font-weight: 600;
    }
    .company-sub {
      font-size: 0.75rem;
      color: #888;
      margin-top: 2px;
    }
    .badge {
      min-width: 60px;
      text-align: center;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      margin-left: 12px;
    }
    .not-found {
      text-align: center;
      color: #999;
      padding: 32px 0;
      font-size: 0.95rem;
    }
    .hint {
      text-align: center;
      color: #bbb;
      padding: 24px 0;
      font-size: 0.85rem;
      line-height: 1.8;
    }
    .count-label {
      font-size: 0.78rem;
      color: #999;
      margin-bottom: 10px;
      text-align: right;
    }
  </style>

// ─── ひらがな↔カタカナ変換 ─────────────────────────────────────────────────
function hiraToKata(str) {
  return str.replace(/[ぁ-ゖ]/g, ch =>
    String.fromCharCode(ch.charCodeAt(0) + 0x60));
}
function kataToHira(str) {
  return str.replace(/[ァ-ヶ]/g, ch =>
    String.fromCharCode(ch.charCodeAt(0) - 0x60));
}
function normalize(str) {
  return hiraToKata(str.toLowerCase())
    .replace(/[･・]/g, '')
    .replace(/[（(][^)）]*[)）]/g, '') // 括弧内除去
    .replace(/\s+/g, '');
}

// ─── 偏差値クエリ判定（数値・範囲）──────────────────────────────────────────
// "67" → 単一値 / "55-60" "55〜60" → 範囲。全角数字・各種ダッシュに対応。
function parseValueQuery(q) {
  const s = q.trim().replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  let m;
  if ((m = s.match(/^(\d{2,3})\s*[-~〜ー―−－]\s*(\d{2,3})$/))) {
    let lo = +m[1], hi = +m[2];
    if (lo > hi) [lo, hi] = [hi, lo];
    return { type: 'range', lo, hi, label: `偏差値${lo}〜${hi}` };
  }
  if ((m = s.match(/^(\d{2,3})$/))) {
    const v = +m[1];
    return { type: 'single', v, label: `偏差値${v}` };
  }
  return null;
}

// ─── 偏差値バッジ色 ──────────────────────────────────────────────────────────
function badgeColor(v) {
  if (v >= 80) return '#7b2ff7';
  if (v >= 77) return '#c0392b';
  if (v >= 75) return '#e74c3c';
  if (v >= 72) return '#e67e22';
  if (v >= 70) return '#d35400';
  if (v >= 67) return '#2980b9';
  if (v >= 65) return '#2471a3';
  if (v >= 62) return '#27ae60';
  if (v >= 60) return '#1e8449';
  if (v >= 57) return '#7d6608';
  if (v >= 55) return '#6e2f0a';
  return '#555';
}

// ─── 検索 ────────────────────────────────────────────────────────────────────
function search(query) {
  if (!query.trim()) return [];

  // 偏差値・範囲での検索
  const vq = parseValueQuery(query);
  if (vq) {
    const results = [];
    for (const [val, companies] of DATASETS[activeKey]) {
      const hit = vq.type === 'single' ? val === vq.v : (val >= vq.lo && val <= vq.hi);
      if (hit) for (const name of companies) results.push({ name, val, score: 1 });
    }
    results.sort((a, b) => b.val - a.val || a.name.localeCompare(b.name, 'ja'));
    return results;
  }

  const q = query.trim();
  const qLower = q.toLowerCase();
  const qNorm = normalize(q);

  // エイリアスから正規化キーワードを拾う
  const aliasTargets = [];
  for (const [k, v] of Object.entries(ALIASES)) {
    if (k.includes(qLower) || qLower.includes(k)) {
      aliasTargets.push(normalize(v));
    }
  }

  const results = [];
  for (const [val, companies] of DATASETS[activeKey]) {
    for (const name of companies) {
      const nameLower = name.toLowerCase();
      const nameNorm = normalize(name);

      // スコアリング
      let score = 0;
      if (nameNorm === qNorm) score = 100;                      // 完全一致
      else if (nameNorm.startsWith(qNorm)) score = 80;          // 前方一致
      else if (nameNorm.includes(qNorm)) score = 60;            // 部分一致
      else if (nameLower.includes(qLower)) score = 60;          // 大小無視
      // エイリアス一致
      if (score === 0) {
        for (const t of aliasTargets) {
          if (nameNorm.includes(t) || t.includes(nameNorm)) { score = 55; break; }
        }
      }
      // 先頭文字一致（1文字入力時）
      if (score === 0 && qNorm.length === 1 && nameNorm.startsWith(qNorm)) score = 40;

      if (score > 0) results.push({ name, val, score });
    }
  }

  // スコア降順 → 偏差値降順
  results.sort((a, b) => b.score - a.score || b.val - a.val);
  return results;
}

// ─── 表示 ────────────────────────────────────────────────────────────────────
function render(results, query) {
  const el = document.getElementById('results');
  if (!query.trim()) {
    el.innerHTML = `<div class="hint">社名・英語名・ローマ字・ひらがなで検索できます<br>例：toyota → トヨタ自動車　／　そ → ソニー他<br>偏差値でも検索 → 67　または　55-60（範囲）</div>`;
    return;
  }
  const vq = parseValueQuery(query);
  if (results.length === 0) {
    el.innerHTML = vq
      ? `<div class="not-found">${vq.label}の企業はありません</div>`
      : `<div class="not-found">「${query}」は登録されていません</div>`;
    return;
  }
  const cap = vq ? results.length : 30;   // 偏差値検索は全件表示
  const show = results.slice(0, cap);
  const label = vq
    ? `${vq.label}：${results.length}件`
    : `${results.length}件ヒット${results.length > 30 ? '（上位30件表示）' : ''}`;
  el.innerHTML = `<div class="count-label">${label}</div>` +
    show.map(r => `
      <div class="result-card">
        <div>
          <div class="company-name">${r.name}</div>
        </div>
        <div class="badge" style="background:${badgeColor(r.val)}">${r.val}</div>
      </div>`).join('');
}

// ─── イベント ────────────────────────────────────────────────────────────────
const input = document.getElementById('query');
input.addEventListener('input', () => {
  const q = input.value;
  render(search(q), q);
});

function clearSearch() {
  input.value = '';
  render([], '');
  input.focus();
}

function switchTab(key) {
  if (key === activeKey) return;
  activeKey = key;
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.key === key));
  document.getElementById('subtitle').textContent = key === 'it'
    ? 'IT業界ランキング（3ソース統合・序列優先で総合スケールに較正 / 287社）｜ローマ字・ひらがなでも検索可'
    : '2026年版・総合ランキング｜ローマ字・ひらがなでも検索可';
  input.placeholder = key === 'it'
    ? '例：google、あくせんちゅあ、NTT...'
    : '例：sony、そにー、ソニー、三菱...';
  render(search(input.value), input.value);
  input.focus();
}
